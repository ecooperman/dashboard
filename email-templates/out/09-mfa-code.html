<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Your sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#F6F1E7">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F6F1E7" style="background:#F6F1E7">
<tr><td align="center" style="padding:32px 16px">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px">
    <tr><td bgcolor="#ffffff" style="background:#ffffff;border:1px solid #E3D9C3;border-radius:12px;padding:28px 32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
      <div style="text-align:center;padding:0 0 18px">
        <img src="https://static.evancooperman.com/logo-email.png" width="72" height="72" alt="Brassworks" style="display:inline-block;border:0;width:72px;height:72px">
        <div style="margin-top:6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;letter-spacing:.5px;color:#4A3010">Brassworks</div>
      </div>
      <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;color:#2B2A26;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Your sign-in code</h1>
      <p style="margin:0 0 14px;font-size:16px;line-height:1.55;color:#2B2A26">Enter this code to finish signing in as <strong>{{ user.email }}</strong>:</p>
      <div style="margin:22px 0;padding:16px 20px;background:#F6F1E7;border:1px solid #E3D9C3;border-radius:8px;font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:30px;letter-spacing:6px;text-align:center;color:#4A3010">{{ code }}</div>
    </td></tr>
    <tr><td align="center" style="padding:20px 8px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6B685F">
      You received this because {{ user.email }} was used with Brassworks. If that wasn't you, you can safely ignore this email.<br>
      <span style="color:#4A3010">Brassworks</span> &middot; Lists, trips, plans and the rest of the workshop
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
