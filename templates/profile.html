<!doctype html>
<html lang="en" data-ui="v2">
<head>
  <title>Your profile - Brassworks</title>
{% include "_head.html" %}
</head>
<body>
  <header class="app-header">
    <h1>Your profile</h1>
    <p class="subtitle">Signed in as {{ email }}</p>
  </header>

  <div id="app-nav-mount"></div>

  <main>
    <div id="page-message" class="page-message hidden"></div>

    <section class="section">
      <h2>Your name</h2>
      <p class="field-hint">So the people who let you in can tell who you are. It is never needed to sign in.</p>
      <div id="profile-name" class="people-name-form"></div>
    </section>

    <section class="section" id="my-feedback-section">
      <h2>Your feedback</h2>
      <p class="field-hint">What you have sent from the Send feedback entry in any app's menu, and whether it has been dealt with.</p>
      <div id="my-feedback"></div>
    </section>
  </main>

  <script src="{{ shared_assets_base }}/theme.js"></script>
  <script src="{{ shared_assets_base }}/icons.js"></script>
  <script src="/nav.js"></script>
  <script src="/profile.js"></script>
</body>
</html>
