<!doctype html>
<html lang="en" data-ui="v2">
<head>
  <title>Person - Brassworks</title>
{% include "_head.html" %}
</head>
<body>
  <header class="app-header">
    <h1 id="who">Person</h1>
  </header>

  <div id="app-nav-mount"></div>

  <main>
    <div id="page-message" class="page-message hidden"></div>

    <section class="section">
      <h2>Overall</h2>
      <div id="overall"></div>
    </section>

    <section class="section">

      <div id="apps"></div>
    </section>
  </main>

  <script src="{{ shared_assets_base }}/theme.js"></script>
  <script src="{{ shared_assets_base }}/icons.js"></script>
  <script src="/nav.js"></script>
  <script src="/usage.js"></script>
