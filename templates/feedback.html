<!doctype html>
<html lang="en" data-ui="v2">
<head>
  <title>Feedback - Brassworks</title>
{% include "_head.html" %}
</head>
<body>
  <header class="app-header">
    <h1>Feedback</h1>
  </header>

  <div id="app-nav-mount"></div>

  <main>
    <div id="page-message" class="page-message hidden"></div>

    <section class="section">
      <h2>Messages</h2>
      <p class="field-hint">What people sent from the Send feedback entry in each app's menu, by app. Reply by email to the address shown; tick a message off when you have dealt with it.</p>
      <div id="import-jobs" class="hidden">
        <p class="field-hint">The Jobs app used to keep its own messages. Copy them in once so everything is here.</p>
        <button type="button" class="secondary-btn" id="import-jobs-btn" data-btn-icon="download">Copy the Jobs messages here</button>
      </div>
      <div id="inbox"></div>
    </section>
  </main>

  <script src="{{ shared_asset('theme.js') }}"></script>
  <script src="{{ shared_asset('icons.js') }}"></script>
  <script src="{{ asset('nav.js') }}"></script>
  <script src="{{ asset('usage.js') }}"></script>
  <script src="{{ asset('feedback.js') }}"></script>
</body>
</html>
